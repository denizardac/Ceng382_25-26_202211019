<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Uchiha Association</title>
  <!-- Özel Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* Sıfırlama */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body */
    body {
      font-family: "Orbitron", sans-serif;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
      /* Başlangıçta statik PNG arkaplan */
      background: url("images/background-static.png") center center no-repeat;
      background-size: cover;
    }

    /* Gizli checkbox */
    #toggle {
      display: none;
    }

    /* .wrapper => Sadece konumlama için */
    .wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Üst Orta'daki İlk Sharingan */
    .top-sharingan {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      /* Başlangıçta görünür */
      opacity: 1;
    }
    .sharingan1 {
      width: 100px;
      height: 100px;
      border-radius: 50%;
    }

    /* Container (Login kutusu) */
    .container {
      position: relative;
      width: 320px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      text-align: center;
      /* Başlangıçta görünür */
      opacity: 1;
    }

    .title {
      font-size: 1.3rem;
      color: #fff;
      margin-bottom: 15px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }
    .login-form input {
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
    }

    /* 2. Sharingan (tıklanabilir) label */
    .sharingan2-label {
      display: inline-block;
      margin: 0 auto;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .sharingan2-label:hover {
      transform: scale(1.07);
    }

    /* 2. Sharingan -> .sharingan2 (span) */
    .sharingan2 {
      display: block;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      margin: 0 auto;
      /* Başlangıçta PNG (statik) */
      opacity: 1;
      background-image: url("images/sharingan2-static.png");
    }

    /*
      2 adet CSS çizimi
      *** DAHA DETAYLI DIAMOND ***
    */
    .diamond {
      position: absolute;
      top: -40px;
      left: -40px;
      width: 80px;
      height: 80px;
      /* Kırmızıdan koyu kırmızıya gradyan */
      background: linear-gradient(45deg, #ff4f4f, #7a0000);
      /* Elmas şekli */
      transform: rotate(45deg);
      /* Hafif parıltı efekti */
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
      /* Hafif köşeleri yumuşatmak isterseniz */
      border-radius: 10%;
      /* Yukarı-aşağı animasyon */
      animation: floatDiamond 2s infinite alternate;
    }
    /* Elmasın iç parlaması */
    .diamond::before {
      content: "";
      position: absolute;
      top: 15px;
      left: 15px;
      width: 50px;
      height: 50px;
      /* Şeffaf beyazdan saydamlığa gradyan */
      background: linear-gradient(45deg, rgba(255,255,255,0.5), transparent);
      transform: rotate(-45deg);
      border-radius: 5px;
    }
    @keyframes floatDiamond {
      0% {
        transform: rotate(45deg) translateY(0);
      }
      100% {
        transform: rotate(45deg) translateY(20px);
      }
    }

    /* *** DAHA DETAYLI KUNAI *** */
    .kunai {
      position: absolute;
      bottom: -40px;
      right: -40px;
      width: 0;
      height: 0;
      /* Ucu */
      border: 20px solid transparent;
      border-top: 30px solid #333;
      /* 360° dönme */
      animation: spinKunai 2s linear infinite;
    }
    /* Kunai sapındaki halka (pseudo-element) */
    .kunai::before {
      content: "";
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border: 2px solid #333;
      border-radius: 50%;
      background: #222;
    }
    /* Kunai sapının kendisi (ikinci pseudo-element) */
    .kunai::after {
      content: "";
      position: absolute;
      bottom: 90%;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 20px;
      background: #333;
    }
    @keyframes spinKunai {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /*
       Animasyon keyframe'leri
       6.3s = 2.7s + 3.6s
       - 0~2.7s: Sharingan2 => GIF, arkaplan => statik, container + top-sharingan => görünür
       - 2.7~6.3s: container + top-sharingan => gizli, arkaplan => GIF
       - 6.3s bitince => tekrar başa
    */

    /* 1) Arka plan animasyonu => wrapper'a uygularız */
    @keyframes bgAnim {
      /* 0~42.857% => statik PNG */
      0%, 42.857% {
        background: url("images/background-static.png") center center no-repeat;
        background-size: cover;
      }
      /* 42.8571% => anlık "none" (bazı tarayıcılarda GIF'i resetlemek için) */
      42.8571% {
        background: none;
      }
      /* 42.8572%~99.9999% => GIF */
      42.8572%, 99.9999% {
        background: url("images/background-animated.gif") center center no-repeat;
        background-size: cover;
      }
      /* 100% => tekrar statik */
      100% {
        background: url("images/background-static.png") center center no-repeat;
        background-size: cover;
      }
    }

    /* 2) Container animasyonu */
    @keyframes containerAnim {
      0%, 42.857% {
        opacity: 1;
      }
      42.8571%, 99.9999% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    /* 3) Üstteki Sharingan animasyonu */
    @keyframes topSharinganAnim {
      0%, 42.857% {
        opacity: 1;
      }
      42.8571%, 99.9999% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    /* 4) 2. Sharingan animasyonu => PNG -> GIF -> kaybol -> tekrar PNG */
    @keyframes sharingan2Anim {
      0% {
        opacity: 1;
        background-image: url("images/sharingan2-static.png");
      }
      /* Hemen GIF'e geçsin, 2.7s sürsün */
      0.0001%, 42.857% {
        opacity: 1;
        background-image: url("images/sharingan2.gif");
      }
      /* 2.7~6.3s => kaybol */
      42.8571%, 99.9999% {
        opacity: 0;
        background-image: url("images/sharingan2.gif");
      }
      /* 6.3s => tekrar PNG */
      100% {
        opacity: 1;
        background-image: url("images/sharingan2-static.png");
      }
    }

    /*
       #toggle:checked => animasyon "running"
       Base durumda animasyon yok (her şey statik).
    */
    #toggle:checked ~ .wrapper {
      animation: bgAnim 6.3s forwards;
    }
    #toggle:checked ~ .wrapper .container {
      animation: containerAnim 6.3s forwards;
    }
    #toggle:checked ~ .wrapper .top-sharingan {
      animation: topSharinganAnim 6.3s forwards;
    }
    #toggle:checked ~ .wrapper .sharingan2 {
      animation: sharingan2Anim 6.3s forwards;
    }
  </style>
</head>
<body>

  <!-- Gizli checkbox (animasyonu tetiklemek için) -->
  <input type="checkbox" id="toggle" />

  <!-- Tüm sayfayı saran alan (arka planı burada değiştireceğiz) -->
  <div class="wrapper">
    
    <!-- Üst Orta'daki İlk Sharingan (kaybolup geri gelecek) -->
    <div class="top-sharingan">
      <img
        src="images/sharingan1.png"
        alt="Sharingan1"
        class="sharingan1"
      />
    </div>

    <!-- Login Container -->
    <div class="container">
      <h1 class="title">Uchiha Association Login</h1>
      <form class="login-form">
        <input type="text" placeholder="Uchiha ID" />
        <input type="password" placeholder="Password" />
        <!-- Login butonu yerine 2. Sharingan (tıklanabilir) -->
        <label for="toggle" class="clickable sharingan2-label">
          <!-- Görseli background-image ile yöneteceğiz -->
          <span class="sharingan2"></span>
        </label>
      </form>

      <!-- 2 adet CSS çizimi (diamond & kunai) -->
      <div class="diamond"></div>
      <div class="kunai"></div>
    </div>

  </div>
</body>
</html>
