<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Uchiha Association</title>
  <!-- Özel Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <!-- Harici CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Gizli checkbox (animasyonu tetiklemek için) -->
  <input type="checkbox" id="toggle" />

  <!-- Tüm sayfayı saran alan -->
  <div class="wrapper">
    
    <!-- Üst Orta'daki İlk Sharingan -->
    <div class="top-sharingan">
      <img
        src="images/sharingan1.png"
        alt="Sharingan1"
        class="sharingan1"
      />
    </div>

    <!-- Login Container (siyah kutu) -->
    <div class="container">
      <h1 class="title">Uchiha Association Login</h1>

      <form class="login-form">
        <!-- Kullanıcı adı ve şifre -->
        <input id="usernameInput" type="text" placeholder="Uchiha ID" />
        <input id="passwordInput" type="password" placeholder="Password" />

        <!-- Login butonu (JS ile verileri kontrol edip yönlendirecek) -->
        <button type="button" class="login-btn" id="loginBtn">Login</button>

        <!-- 2. Sharingan (tıklanabilir, animasyonu tetikler) -->
        <label for="toggle" class="clickable sharingan2-label">
          <span class="sharingan2"></span>
        </label>
      </form>

      <!-- 2 adet CSS çizimi (diamond & kunai) -->
      <div class="diamond"></div>
      <div class="kunai"></div>
    </div>

    <!-- Sağ alt köşede canlı saat (container dışında!) -->
    <div class="clock" id="liveClock"></div>

  </div>

  <!-- Harici JS Dosyası -->
  <script src="scripts.js"></script>
</body>
</html>
