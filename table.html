<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Uchiha Association - Table</title>
  <!-- Özel Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <!-- Harici CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Form ve tabloyu sarmalayan bölüm -->
  <div class="table-wrapper">
    <h2 class="table-title">Class Info</h2>
    
    <!-- Class Bilgisi Formu -->
    <form id="classForm" class="class-form">
      <input type="text" id="className" placeholder="Class Name" />
      <input type="number" id="classCount" placeholder="Number of People" />
      <input type="text" id="classDescription" placeholder="Description" />
      <button type="submit">Add Class</button>
    </form>

    <!-- Class Tablosu -->
    <table id="classTable">
      <thead>
        <tr>
          <th>Class Name</th>
          <th>Number of People</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        <!-- Yeni eklenen satırlar buraya gelecek -->
      </tbody>
    </table>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
